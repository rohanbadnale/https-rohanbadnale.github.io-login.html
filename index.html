<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  width: 420px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-align: center;
  animation: fadeIn 0.6s ease-in-out;
}

h2 {
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

input:focus {
  border-color: #667eea;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  background: #667eea;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #5a67d8;
}

#logoutBtn {
  background: #e53e3e;
}

#logoutBtn:hover {
  background: #c53030;
}

table {
  width: 100%;
  margin-top: 15px;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  text-align: center;
}

th {
  background: #667eea;
  color: #fff;
}

tr:nth-child(even) {
  background: #f2f2f2;
}

.action-btn {
  padding: 4px 8px;
  margin: 2px;
  font-size: 12px;
}

.edit {
  background: #38a169;
}

.delete {
  background: #e53e3e;
}

#search {
  margin-top: 10px;
  border: 2px solid #667eea;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}

@media (max-width: 500px) {
  .container { width: 90%; }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <h2>Student Management</h2>

  <input type="text" id="name" placeholder="Name">
  <input type="number" id="age" placeholder="Age">
  <input type="text" id="course" placeholder="Course">

  <button onclick="addOrUpdateStudent()">Save Student</button>

  <input type="text" id="search" placeholder="Search..." onkeyup="searchStudent()">

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Course</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="studentList"></tbody>
  </table>

  <button id="logoutBtn" onclick="logout()">Logout</button>
</div>

</div>

<script>
let students = [];
let editIndex = -1;

// LOGIN
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if (user === "admin" && pass === "1234") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    alert("Invalid login");
  }
}

function logout() {
  location.reload();
}

// LOAD DATA
window.onload = function () {
  let data = localStorage.getItem("students");
  if (data) {
    students = JSON.parse(data);
    displayStudents();
  }
};

// SAVE
function saveData() {
  localStorage.setItem("students", JSON.stringify(students));
}

// ADD / UPDATE
function addOrUpdateStudent() {
  let name = document.getElementById("name").value;
  let age = document.getElementById("age").value;
  let course = document.getElementById("course").value;

  if (name === "" || age === "" || course === "") {
    alert("Fill all fields");
    return;
  }

  if (editIndex === -1) {
    students.push({ name, age, course });
  } else {
    students[editIndex] = { name, age, course };
    editIndex = -1;
  }

  saveData();
  displayStudents();
  clearFields();
}

// DISPLAY
function displayStudents() {
  let list = document.getElementById("studentList");
  list.innerHTML = "";

  students.forEach((s, i) => {
    list.innerHTML += `
      <tr>
        <td>${s.name}</td>
        <td>${s.age}</td>
        <td>${s.course}</td>
        <td>
          <button class="action-btn edit" onclick="editStudent(${i})">Edit</button>
          <button class="action-btn delete" onclick="deleteStudent(${i})">Delete</button>
        </td>
      </tr>
    `;
  });
}

// DELETE
function deleteStudent(i) {
  students.splice(i, 1);
  saveData();
  displayStudents();
}

// EDIT
function editStudent(i) {
  document.getElementById("name").value = students[i].name;
  document.getElementById("age").value = students[i].age;
  document.getElementById("course").value = students[i].course;
  editIndex = i;
}

// SEARCH
function searchStudent() {
  let input = document.getElementById("search").value.toLowerCase();
  let rows = document.querySelectorAll("#studentList tr");

  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(input)
      ? ""
      : "none";
  });
}

// CLEAR
function clearFields() {
  document.getElementById("name").value = "";
  document.getElementById("age").value = "";
  document.getElementById("course").value = "";
}
</script>

</body>
</html>
