<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Student System</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI';}

body{
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  background:#fff;
  width:500px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{text-align:center;margin-bottom:10px;}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#667eea;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.nav{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.nav button{
  width:48%;
}

.profile-box{
  text-align:center;
  padding:10px;
  background:#f2f2f2;
  border-radius:10px;
}

table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

th,td{padding:8px;text-align:center;}

th{background:#667eea;color:#fff;}

.edit{background:#38a169;}
.delete{background:#e53e3e;}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
  <h2>Login</h2>
  <input id="loginUser" placeholder="Username">
  <input id="loginPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="showSignup()">Sign Up</button>
</div>

<!-- SIGNUP -->
<div id="signupPage" style="display:none;">
  <h2>Sign Up</h2>
  <input id="signupUser" placeholder="Username">
  <input id="signupPass" type="password" placeholder="Password">
  <button onclick="signup()">Register</button>
  <button onclick="showLogin()">Back</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <div class="nav">
    <button onclick="showDashboard()">Dashboard</button>
    <button onclick="showProfile()">Profile</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <h2>Welcome, <span id="userDisplay"></span></h2>

    <input id="name" placeholder="Name">
    <input id="age" placeholder="Age">
    <input id="course" placeholder="Course">

    <button onclick="addStudent()">Save</button>

    <input id="search" placeholder="Search..." onkeyup="searchStudent()">

    <table>
      <thead>
        <tr><th>Name</th><th>Age</th><th>Course</th><th>Action</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <!-- PROFILE -->
  <div id="profile" style="display:none;">
    <div class="profile-box">
      <h3>User Profile</h3>
      <p><b>Username:</b> <span id="profileUser"></span></p>
    </div>
  </div>

  <button onclick="logout()">Logout</button>

</div>

</div>

<script>
let users=JSON.parse(localStorage.getItem("users"))||[];
let students=JSON.parse(localStorage.getItem("students"))||[];
let currentUser=localStorage.getItem("currentUser");

// INIT
window.onload=()=>{
  if(currentUser){showApp();}
  displayStudents();
};

// AUTH
function signup(){
  let u=signupUser.value;
  let p=signupPass.value;
  users.push({u,p});
  localStorage.setItem("users",JSON.stringify(users));
  alert("Account created");
  showLogin();
}

function login(){
  let u=loginUser.value;
  let p=loginPass.value;
  let user=users.find(x=>x.u===u&&x.p===p);
  if(user){
    localStorage.setItem("currentUser",u);
    showApp();
  }else alert("Invalid");
}

function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

// UI SWITCH
function showSignup(){loginPage.style.display="none";signupPage.style.display="block";}
function showLogin(){signupPage.style.display="none";loginPage.style.display="block";}
function showApp(){
  loginPage.style.display="none";
  signupPage.style.display="none";
  app.style.display="block";
  userDisplay.innerText=currentUser;
  profileUser.innerText=currentUser;
}

function showDashboard(){dashboard.style.display="block";profile.style.display="none";}
function showProfile(){dashboard.style.display="none";profile.style.display="block";}

// STUDENTS
function addStudent(){
  students.push({name:name.value,age:age.value,course:course.value});
  localStorage.setItem("students",JSON.stringify(students));
  displayStudents();
}

function displayStudents(){
  list.innerHTML="";
  students.forEach((s,i)=>{
    list.innerHTML+=`
    <tr>
      <td>${s.name}</td>
      <td>${s.age}</td>
      <td>${s.course}</td>
      <td>
        <button class="delete" onclick="deleteStudent(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

function deleteStudent(i){
  students.splice(i,1);
  localStorage.setItem("students",JSON.stringify(students));
  displayStudents();
}

function searchStudent(){
  let val=search.value.toLowerCase();
  document.querySelectorAll("#list tr").forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(val)?"":"none";
  });
}
</script>

</body>
</html>
